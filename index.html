    <body>
        <div class="terminal-window" role="main">
            <header role="banner" aria-label="Site Header">
                <a
                    href="https://github.com/cosmicwanderer7/"
                    target="_blank"
                    aria-label="GitHub Profile"
                >
                    <i
                        class="fa-brands fa-github header-icon github-icon"
                        aria-hidden="true"
                    ></i>
                </a>

                <div class="centered" aria-hidden="true">
                    <span>stefan@archrx5500m</span>
                </div>

                <a
                    href="#"
                    onclick="
                        close_window();
                        return false;
                    "
                    aria-label="Close Window"
                >
                    <i
                        class="fa-solid fa-circle-xmark header-icon close-icon"
                        aria-hidden="true"
                    ></i>
                </a>
            </header>

            <hr aria-hidden="true" />

            <div id="contentscroll">
                <div class="content-container">
                    <div
                        class="ascii-Hero"
                        role="presentation"
                        aria-hidden="true"
                    >
                        <pre class="ascii">
    _        __
___| |_ ___ / _| __ _ _ __
/ __| __/ _ \ |_ / _` | '_ \
\__ \ ||  __/  _| (_| | | | |
|___/\__\___|_|  \__,_|_| |_|
        </pre
                        >
                    </div>

                    <section
                        class="profile-info"
                        aria-labelledby="profile-heading"
                    >
                        <h1 id="profile-heading" class="sr-only">
                            Profile Information
                        </h1>

                        <div class="info-item">
                            <div class="name">
                                <i
                                    class="fa-solid fa-address-card"
                                    aria-hidden="true"
                                ></i>
                                <span>Stefan Ingimarsson</span>
                            </div>
                        </div>

                        <div class="info-item">
                            <i
                                class="fa-solid fa-file-invoice"
                                aria-hidden="true"
                            ></i>
                            <span>Resume</span>
                            <a
                                href="https://drive.google.com/file/d/1AGQ_kEDygjT9YzcfaiofLIPHVgkIwwnB/view?usp=sharing"
                                class="link-text"
                                target="_blank"
                                aria-label="Download my resume"
                                >→ &nbsp;Download my resume...</a
                            >
                        </div>

                        <div class="info-item">
                            <i
                                class="fa-brands fa-github"
                                aria-hidden="true"
                            ></i>
                            <span>GitHub</span>
                            <a
                                href="https://github.com/StefanIngimar"
                                class="link-text"
                                target="_blank"
                                aria-label="GitHub StefanIngimar"
                                >→ &nbsp;github/StefanIngimar</a
                            >
                        </div>

                        <div class="info-item">
                            <i
                                class="fa-brands fa-linkedin-in"
                                aria-hidden="true"
                            ></i>
                            <span>LinkedIn</span>
                            <a
                                href="https://www.linkedin.com/in/stefan-ingimarsson-679331261/"
                                class="link-text"
                                target="_blank"
                                aria-label="LinkedIn stefan-ingimarsson"
                                >→ &nbsp;linkedin/stefan-ingimarsson</a
                            >
                        </div>

                <section id="terminal" aria-label="Terminal Emulator">
                    <a id="before"></a>

                    <div
                        id="command"
                        onclick="document.getElementById('texter').focus()"
                    >
                        <label for="texter" class="sr-only"
                            >Command Input</label
                        >
                        <input
                            type="text"
                            id="texter"
                            class="texter"
                            aria-label="Command line input"
                            onkeyup="typeIt(this, event)"
                            onkeydown="
                                typeIt(this, event);
                                moveIt(this.value.length, event);
                            "
                            onkeypress="typeIt(this, event)"
                        />
                        <div id="liner">
                            <span id="typer" aria-live="polite"></span
                            ><b class="cursor" id="cursor" aria-hidden="true"
                                >█</b
                            >
                            <div class="list" aria-hidden="true"></div>
                        </div>
                    </div>
                </section>
            </div>
